<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080910">
  <title>Altap.Biz — Admin Girişi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080910;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: #151622;
      border: 1px solid #303044;
      border-radius: 18px;
    }
    h1 { color: #9385ff; margin-top: 0; }
    p { color: #b8b8ca; line-height: 1.5; }
    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #39394d;
      border-radius: 9px;
      background: #090a12;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 9px;
      background: #7565ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>ALTAP.BIZ</h1>
    <h2>Admin girişi</h2>
    <p>İdarəetmə panelinə daxil olmaq üçün hesab məlumatlarını yaz.</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="E-poçt ünvanı"
             autocomplete="username" required>
      <input id="password" type="password" placeholder="Parol"
             autocomplete="current-password" required>
      <button type="submit">Daxil ol</button>
    </form>
    <p id="message" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://fxidqmqoqlkijwdvvzyk.supabase.co";

    // Buraya Supabase-in publishable (anon) açarını əlavə et.
    // service_role / secret açarını bura YAZMA.
    const SUPABASE_PUBLISHABLE_KEY = "BURAYA_PUBLISHABLE_KEY";

    const message = document.getElementById("message");
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (SUPABASE_PUBLISHABLE_KEY === "BURAYA_PUBLISHABLE_KEY") {
        message.textContent =
          "Əvvəlcə Supabase publishable açarı əlavə edilməlidir.";
        return;
      }

      message.textContent = "Giriş yoxlanılır...";

      try {
        const supabase = createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;

        const { data: allowed, error: roleError } =
          await supabase.rpc("is_altap_admin");

        if (roleError || allowed !== true) {
          await supabase.auth.signOut();
          message.textContent =
            "Bu hesabın admin icazəsi yoxdur.";
          return;
        }

        message.textContent =
          "Admin icazəsi təsdiqləndi. İdarəetmə bölmələri növbəti mərhələdə qoşulmalıdır.";
      } catch (error) {
        message.textContent = "Giriş alınmadı: " + error.message;
      }
    });
  </script>
</body>
</html>
