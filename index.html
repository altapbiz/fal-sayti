<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mostbet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(ellipse at top, #176b36 0%, transparent 65%),
        linear-gradient(180deg, #06451f 0%, #032b16 55%, #01190c 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

.card {
    width: 100%;
    padding: 32px 22px;
    background: linear-gradient(160deg, #0b5428, #06371c);
    border: 1px solid rgba(255, 221, 0, 0.65);
    border-radius: 16px;
    box-shadow: 0 12px 45px rgba(0, 0, 0, 0.4);
}

.logo {
    font-size: 39px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -2px;
    margin-bottom: 28px;
    color: #ffdf00;
    text-shadow: 0 2px 12px rgba(255, 223, 0, 0.2);
}

.logo span {
    color: #ffffff;
}

.message {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.6;
    color: #ffffff;
    margin-bottom: 28px;
}

.highlight {
    color: #ffdf00;
    font-weight: 900;
}

.arrow {
    display: block;
    margin-top: 8px;
    font-size: 30px;
}

.register-btn {
    display: block;
    width: 100%;
    padding: 18px 12px;
    border-radius: 8px;
    background: linear-gradient(180deg, #ffe94d, #ffd000);
    color: #12351b;
    font-size: 19px;
    font-weight: 900;
    text-decoration: none;
    box-shadow: 0 5px 0 #b99a00;
    transition: 0.2s;
}

.register-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #b99a00;
}

@media (max-width: 360px) {
    .logo {
        font-size: 34px;
    }

    .message {
        font-size: 19px;
    }

    .register-btn {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="logo">MOST<span>BET</span></div>

        <div class="message">
            Mostbetdə yeni hesab açıb
            <span class="highlight">20₼ depozit</span>
            edənlərə bonus pul verilir elə indi sən də qeydiyyatdan keç qazan
            <span class="arrow">👇</span>
        </div>

        <a
            class="register-btn"
            href="https://66avrzh.com/MXKF"
            target="_blank"
            rel="noopener noreferrer"
        >QEYDİYYATDAN KEÇ</a>

    </div>
</div>

</body>
</html>
