<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostbet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101010, #252525, #080808);
    color: white;
}

.card {
    width: 100%;
    max-width: 420px;
    padding: 35px 24px;
    text-align: center;
    background: linear-gradient(145deg, #202020, #111111);
    border: 2px solid #f5c400;
    border-radius: 18px;
    box-shadow: 0 0 30px rgba(245, 196, 0, 0.18);
}

.logo {
    font-size: 35px;
    font-weight: 900;
    color: #f5c400;
    margin-bottom: 30px;
    font-style: italic;
}

.logo span {
    color: white;
}

.message {
    font-size: 21px;
    line-height: 1.6;
    font-weight: bold;
    margin-bottom: 30px;
}

.message strong {
    color: #f5c400;
}

.button {
    display: block;
    width: 100%;
    padding: 17px 10px;
    background: linear-gradient(90deg, #ffdf00, #f5b900);
    color: #111;
    text-decoration: none;
    font-size: 19px;
    font-weight: 900;
    border-radius: 9px;
    transition: 0.2s;
}

.button:hover {
    transform: scale(1.03);
    background: #ffe64d;
}

</style>
</head>

<body>

<div class="card">

    <div class="logo">MOST<span>BET</span></div>

    <div class="message">
        Mostbetdə yeni hesab açıb
        <strong>20₼ depozit</strong>
        edənlərə bonus pul verilir,
        elə indi sən də qeydiyyatdan keç qazan 👇
    </div>

    <a class="button"
       href="https://66avrzh.com/MXKF"
       target="_blank"
       rel="noopener noreferrer">
       QEYDİYYATDAN KEÇ
    </a>

</div>

</body>
</html>
