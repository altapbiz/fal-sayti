<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostbet Bonus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#171717;
  font-family:Arial,sans-serif;
  color:#fff;
  padding:20px;
}
.card{
  max-width:480px;
  margin:20px auto;
  background:#242424;
  border:1px solid #f5c400;
  border-radius:10px;
  overflow:hidden;
  text-align:center;
}
.header{
  background:#f5c400;
  padding:22px 10px;
}
.logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:37px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-2px;
  color:#171717;
}
.logo-mark{
  width:34px;
  height:34px;
  margin-right:7px;
}
.content{padding:28px 22px}
.gift-icon{
  width:66px;
  height:66px;
  margin:0 auto 22px;
  color:#f5c400;
}
.message{
  font-size:22px;
  line-height:1.5;
  font-weight:700;
  margin-bottom:22px;
}
.highlight{color:#f5c400}
.arrow-icon{
  display:block;
  width:32px;
  height:32px;
  margin:14px auto;
  color:#f5c400;
}
.button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:17px 12px;
  background:#f5c400;
  color:#171717;
  text-decoration:none;
  font-weight:900;
  font-size:18px;
  border-radius:5px;
}
.button svg{width:22px;height:22px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5H36L25 17L36 35H23L15 22L4 35V5Z"
              fill="#171717"/>
        <path d="M4 5H16L4 19V5Z" fill="#fff"/>
      </svg>
      MOSTBET
    </div>
  </div>
  <div class="content">
    <svg class="gift-icon" viewBox="0 0 64 64" fill="none"
         stroke="currentColor" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="26" width="48" height="31" rx="3"/>
      <path d="M5 18h54v10H5z"/>
      <path d="M32 18v39"/>
      <path d="M32 18C13 20 12 5 23 5c8 0 9 13 9 13Z"/>
      <path d="M32 18C51 20 52 5 41 5c-8 0-9 13-9 13Z"/>
    </svg>
    <div class="message">
      Mostbetdə yeni hesab açıb
      <span class="highlight">20₼</span>
      depozit edənlərə bonus pul verilir, elə indi sən də qeydiyyatdan keç, qazan
    </div>
    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v17"/>
      <path d="m5 13 7 7 7-7"/>
    </svg>
    <a class="button"
       href="https://66avrzh.com/MXKF"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17 17 7"/>
        <path d="M7 7h10v10"/>
      </svg>
      QEYDİYYATDAN KEÇ
    </a>
  </div>
</div>
</body>
</html>
